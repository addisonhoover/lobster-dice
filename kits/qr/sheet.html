<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crimson Dice — pouch QR stickers</title>
<style>
  @page { size: letter; margin: 0.45in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #1c1c1c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 11px; color: #555; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { border: 1px solid #ddd; border-radius: 8px; padding: 8px 6px 6px; text-align: center; break-inside: avoid; }
  .cell img { width: 100%; height: auto; display: block; }
  .n { font-weight: 900; font-size: 15px; margin-top: 4px; color: #9E1B32; }
  .u { font-size: 8px; color: #666; word-break: break-all; }
  @media print { .noprint { display: none; } }
</style>
</head>
<body>
  <h1>Crimson Dice · pouches 01–25</h1>
  <p class="sub noprint">Print this page for pouch stickers. Each code opens the same Lobster Dice app as Crimson at that kit URL. Cut on the boxes.</p>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 25; i++) {
      const id = String(i).padStart(2, '0');
      const url = 'https://lobster-dice.vercel.app/crimson/' + id;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<img src="' + id + '.png" alt="QR ' + id + '"><div class="n">' + id + '</div><div class="u">' + url + '</div>';
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
