<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="354.4" y2="531.7">
      <stop offset="0" stop-color="#ffc48a"/>
      <stop offset="1" stop-color="#bc0a1c"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="140" cy="110" r="460">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>

  <!-- lobster silhouette; group is inset-scaled to match the PNG renderer (scale .9, +14y) -->
  <!-- 1) claw palms -->
  <g fill="#fff6ee" transform="translate(256,270) scale(0.9) translate(-256,-256)">
    <ellipse cx="385" cy="118" rx="62" ry="88" transform="rotate(-16 385 118)"/>
    <ellipse cx="127" cy="118" rx="62" ry="88" transform="rotate(16 127 118)"/>
  </g>
  <!-- 2) pincer cuts painted in the background gradient + glow (display coords) -->
  <g fill="url(#bg)">
    <ellipse cx="311.8" cy="167.4" rx="46.8" ry="70.2" transform="rotate(-18 311.8 167.4)"/>
    <ellipse cx="200.2" cy="167.4" rx="46.8" ry="70.2" transform="rotate(18 200.2 167.4)"/>
    <polygon points="369.4,48.6 360.4,117 392.8,111.6"/>
    <polygon points="142.6,48.6 151.6,117 119.2,111.6"/>
  </g>
  <g fill="url(#glow)">
    <ellipse cx="311.8" cy="167.4" rx="46.8" ry="70.2" transform="rotate(-18 311.8 167.4)"/>
    <ellipse cx="200.2" cy="167.4" rx="46.8" ry="70.2" transform="rotate(18 200.2 167.4)"/>
    <polygon points="369.4,48.6 360.4,117 392.8,111.6"/>
    <polygon points="142.6,48.6 151.6,117 119.2,111.6"/>
  </g>
  <!-- 3) rest of the lobster (repaints any cut overlap) -->
  <g fill="#fff6ee" stroke="#fff6ee" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(256,270) scale(0.9) translate(-256,-256)">
    <!-- claw arms -->
    <line x1="358" y1="182" x2="296" y2="224" stroke-width="42"/>
    <line x1="154" y1="182" x2="216" y2="224" stroke-width="42"/>
    <!-- antennae -->
    <circle cx="205" cy="30" r="24"/><circle cx="307" cy="30" r="24"/>
    <polyline points="214,52 234,80 247,106" fill="none" stroke-width="13"/>
    <polyline points="298,52 278,80 265,106" fill="none" stroke-width="13"/>
    <!-- head + thorax -->
    <ellipse cx="256" cy="162" rx="58" ry="86"/>
    <ellipse cx="256" cy="242" rx="76" ry="72"/>
    <!-- abdomen segments -->
    <ellipse cx="256" cy="312" rx="58" ry="46"/>
    <ellipse cx="256" cy="362" rx="50" ry="38"/>
    <ellipse cx="256" cy="402" rx="43" ry="32"/>
    <!-- legs -->
    <line x1="320" y1="252" x2="424" y2="244" stroke-width="25"/>
    <line x1="320" y1="332" x2="418" y2="344" stroke-width="25"/>
    <line x1="192" y1="252" x2="88"  y2="244" stroke-width="25"/>
    <line x1="192" y1="332" x2="94"  y2="344" stroke-width="25"/>
    <!-- tail skirt, scalloped -->
    <polygon points="240,398 272,398 324,478 256,466 188,478"/>
    <ellipse cx="214" cy="470" rx="26" ry="20" transform="rotate(18 214 470)"/>
    <ellipse cx="298" cy="470" rx="26" ry="20" transform="rotate(-18 298 470)"/>
    <ellipse cx="256" cy="470" rx="26" ry="20"/>
  </g>
</svg>
