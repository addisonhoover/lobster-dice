<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b1f3a" />
<title>Lobster Dice — Scorepad</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lobster Dice" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" type="image/png" />
<style>
  :root{
    --bg1:#0b1f3a; --bg2:#12325c; --bg3:#1b0e2b;
    --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.12);
    --coral:#ff5a4d; --coral2:#ff8566; --gold:#ffcf5c;
    --sea:#3fd0c9; --good:#57e389; --bad:#ff5a4d; --warn:#ffcf5c;
    --ink:#f3f6ff; --muted:#a9bad6;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, #23407a 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 110%, #3a1140 0%, transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;padding-top:calc(14px + env(safe-area-inset-top))}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
  .top{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
  .top .logo{font-size:32px;filter:drop-shadow(0 4px 8px rgba(255,90,77,.5))}
  .top h1{font-size:23px;background:linear-gradient(90deg,#fff,#ffd0c6 55%,var(--coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .top .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
  .top .rules{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:12px;padding:9px 12px;border-radius:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(8px);margin-bottom:14px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .lk{background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.02em;padding:6px 11px;border-radius:999px;text-transform:none}
  /* crew sync box */
  .crewbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
  .crewbox .cb-title{font-weight:800;font-size:14px;margin-bottom:4px}
  .crewbox .cb-hint{font-size:12px;color:var(--muted);line-height:1.5;text-align:left}
  .crewcode-big{font-size:26px;font-weight:900;letter-spacing:.3em;color:#fff}
  .crewrow{display:flex;gap:8px;margin-top:8px}
  .crewrow input{flex:1;min-width:0;width:100%;text-transform:uppercase;text-align:center;font-size:19px;font-weight:800;letter-spacing:.25em;padding:11px}
  .crewrow .btn{flex:0 0 92px;width:92px}
  button{font-family:inherit;cursor:pointer;border:none;color:var(--ink)}
  .btn{width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(180deg,var(--coral2),var(--coral));box-shadow:0 8px 20px rgba(255,90,77,.35);transition:transform .06s ease,filter .15s}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:disabled{opacity:.4;filter:grayscale(.4);box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
  .btn.sea{background:linear-gradient(180deg,#54e0d9,#28b3ab);box-shadow:0 8px 20px rgba(63,208,201,.3);color:#04201e}
  .btn.gold{background:linear-gradient(180deg,#ffe08a,#f5b83f);color:#3a2600;box-shadow:0 8px 20px rgba(255,207,92,.3)}
  .btn.dark{background:var(--card2);border:1px solid var(--line);box-shadow:none}
  .btn.sm{padding:12px;font-size:14px;border-radius:12px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prow .num{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--card2);color:var(--muted)}
  input[type=text],input[type=number]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font-size:16px;font-weight:700}
  input::placeholder{color:#6f83a6}
  .prow input{flex:1}
  .prow .mv{flex:0 0 38px;width:38px;height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:16px;color:var(--muted)}
  .prow .x{flex:0 0 40px;width:40px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:16px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:14px}
  .chip.on{background:linear-gradient(180deg,var(--gold),#f5b83f);color:#3a2600;border-color:transparent;box-shadow:0 6px 16px rgba(255,207,92,.3)}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
  /* scoreboard */
  .sb{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;background:var(--card2);border:1px solid transparent;transition:.15s}
  .p.tap{cursor:pointer}
  .p.tap:active{transform:scale(.99)}
  .p.active{border-color:var(--coral);background:linear-gradient(90deg,rgba(255,90,77,.22),rgba(255,90,77,.05));box-shadow:0 0 0 1px rgba(255,90,77,.35)}
  .p .pn{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .pn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:7px;box-shadow:0 0 10px var(--coral)}
  .p .score{font-size:22px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .p .gap{font-size:11px;color:var(--muted);font-weight:700;min-width:46px;text-align:right}
  .p .lead{font-size:10px;font-weight:900;color:#3a2600;background:var(--gold);padding:2px 7px;border-radius:999px}
  .p.zero .score{color:#7f8dab}
  .score.fire{background:linear-gradient(180deg,#ffe08a,#ff8c3a 55%,#ff3f36);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 14px rgba(255,140,58,.45)}
  .score.fire .fl{-webkit-text-fill-color:initial;font-size:15px;margin-right:3px;display:inline-block;animation:flick .6s ease-in-out infinite alternate}
  @keyframes flick{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.18) rotate(5deg)}}
  .tag0{font-size:9px;font-weight:900;color:#ffb3ab;letter-spacing:.05em}
  .warn0{font-size:13px;margin-left:5px;display:inline-block;animation:warnpulse 1.1s ease-in-out infinite}
  @keyframes warnpulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .p .log{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--muted);font-size:14px}
  .p .mvs{display:flex;flex-direction:column;gap:3px;flex:0 0 30px}
  .p .mvs button{width:30px;height:20px;border-radius:7px;background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1;padding:0}
  /* endgame banner */
  .banner{background:linear-gradient(90deg,rgba(255,207,92,.22),rgba(255,90,77,.12));border:1px solid rgba(255,207,92,.4);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:800;font-size:14px;text-align:center;color:var(--gold)}
  .banner small{display:block;color:var(--muted);font-weight:700;font-size:11px;margin-top:3px}
  /* turn entry */
  .turnhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .turnhead .who{font-size:20px;font-weight:900}
  .turnhead .st{margin-left:auto;font-size:11px;color:var(--muted);font-weight:800;text-align:right}
  .accrual{text-align:center;padding:2px 0 0}
  .accrual .big{font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#bcd2ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .accrual .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rollchips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .rc{padding:17px 0;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:900;color:var(--ink);transition:transform .05s}
  .rc:active{transform:scale(.95);background:linear-gradient(180deg,#54e0d9,#28b3ab);color:#04201e}
  .plus{display:inline-block;font-size:30px;font-weight:900;color:var(--good);vertical-align:super;margin-left:7px;-webkit-text-fill-color:var(--good);animation:pluspop .25s ease-out}
  @keyframes pluspop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  .endlink{display:block;width:100%;background:none;border:none;color:#5f7196;font-size:12px;font-weight:700;padding:10px;margin-top:2px;text-align:center}
  .msg{text-align:center;font-weight:700;font-size:13px;min-height:18px;margin:8px 2px;color:var(--muted)}
  .msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.warn{color:var(--warn)}
  .gate{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;font-weight:800;color:var(--warn);margin:2px 0 10px;text-align:center}
  .lobrow{display:flex;gap:10px;margin-top:10px}
  .lobrow button{flex:1;padding:14px 6px;border-radius:14px;font-weight:800;font-size:14px;line-height:1.2}
  .lob1{background:linear-gradient(180deg,#ff7a5c,#ff3f36);color:#fff;box-shadow:0 8px 18px rgba(255,63,54,.3)}
  .lob2{background:linear-gradient(180deg,#c0392b,#7b1a12);color:#fff;box-shadow:0 8px 18px rgba(123,26,18,.35)}
  .lobrow button small{display:block;font-weight:700;font-size:10px;opacity:.85;margin-top:2px}
  .liab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 2px;font-weight:700}
  .liab b{color:#ffb3ab}
  .toggle{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;transition:.2s;flex:0 0 46px}
  .sw.on{background:var(--sea)}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on i{left:23px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(5,10,22,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal{max-width:440px;width:100%;max-height:86vh;overflow:auto;background:linear-gradient(160deg,#173059,#1b0e2b);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
  .modal h2{font-size:20px;margin-bottom:8px}
  .modal p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 14px}
  .modal .rul{font-size:13px;line-height:1.6;color:#cdd9f0}
  .modal .rul h3{font-size:14px;color:#fff;margin:14px 0 4px}
  .modal .rul b{color:var(--gold)}
  .burst{font-size:44px;text-align:center;margin-bottom:6px}
  .histrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;font-size:12px;font-weight:700;color:var(--muted);text-align:left}
  .histrow b{color:var(--ink);font-size:13px;white-space:nowrap}
  .logline{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
  .logline:last-child{border:none}
  .logline .t{color:var(--muted)}
  .logline .v{font-weight:900;font-variant-numeric:tabular-nums}
  .logline .v.b{color:var(--good)}.logline .v.l{color:var(--coral)}
  /* end */
  .stand{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card2);margin-bottom:8px}
  .stand .rk{font-size:20px;font-weight:900;width:30px;color:var(--muted)}
  .stand.win{background:linear-gradient(90deg,rgba(255,207,92,.25),rgba(255,207,92,.05));border:1px solid rgba(255,207,92,.4)}
  .stand.win .rk{color:var(--gold)}
  .stand .nm{flex:1;font-weight:800;font-size:17px}
  .stand .tot{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .ledger{padding:14px;border-radius:14px;background:var(--card2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ledger .txt{font-weight:700;font-size:14px}
  .ledger .amt{font-size:20px;font-weight:900;color:var(--good);white-space:nowrap}
  .ledger.z{background:linear-gradient(90deg,rgba(255,90,77,.22),rgba(255,90,77,.05));border:1px solid rgba(255,90,77,.4)}
  .ledger.z .amt{color:var(--coral)}
  .zbadge{font-size:9px;font-weight:900;color:#fff;background:var(--coral);padding:3px 7px;border-radius:999px;letter-spacing:.04em;display:inline-block;margin-top:3px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--card2);border-radius:12px;padding:12px}
  .stat .v{font-size:20px;font-weight:900}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
  .spacer{height:8px}.footlink{text-align:center;font-size:11px;color:#5f7196;margin-top:18px}
  /* splash */
  #splash{position:fixed;inset:0;z-index:100;overflow:hidden;pointer-events:none;
    background:radial-gradient(900px 600px at 80% -10%, #23407a 0%, transparent 55%),radial-gradient(700px 500px at 0% 110%, #3a1140 0%, transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    transition:opacity .35s ease}
  #splash.out{opacity:0}
  /* massive lobster towering on the right — whole animal visible, legs grazing the edge */
  /* colossal lobster, mostly off-frame right — only its left claw/side looms into view */
  .sp-lob{position:absolute;left:6vw;top:30vh;height:140vh;width:auto;
    filter:drop-shadow(0 0 60px rgba(255,90,77,.35));
    animation:spLob .7s ease-out both}
  @keyframes spLob{0%{opacity:0;transform:translate(14vw,10vh)}100%{opacity:1;transform:translate(0,0)}}
  /* title: upper-middle left, stacked — big, using the negative space */
  .sp-title{position:absolute;left:7vw;top:9vh;font-size:66px;font-weight:900;letter-spacing:-.02em;line-height:1.04;text-align:left;
    background:linear-gradient(90deg,var(--coral2),#ffd0c6 40%,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:spTitle .55s .1s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes spTitle{0%{opacity:0;transform:translateY(22px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
  /* dice roll in from the left, landing just below the title */
  .sp-dice{position:absolute;top:calc(9vh + 168px);line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
  .sp-dice svg{width:62px;height:62px;display:block}
  .sp-d1{left:8vw;animation:spD1 1.05s .3s linear both}
  .sp-d2{left:29vw;animation:spD2 1.15s .42s linear both}
  /* craps throw: skid in fast, hop, hop smaller, settle */
  @keyframes spD1{
    0%{opacity:0;transform:translate(-110vw,-24px) rotate(-940deg)}
    8%{opacity:1}
    46%{transform:translate(7vw,2px) rotate(-210deg)}
    62%{transform:translate(3.5vw,-34px) rotate(-120deg)}
    76%{transform:translate(1vw,2px) rotate(-52deg)}
    87%{transform:translate(.3vw,-12px) rotate(-24deg)}
    94%{transform:translate(0,2px) rotate(-12deg)}
    100%{transform:translate(0,0) rotate(-8deg)}}
  @keyframes spD2{
    0%{opacity:0;transform:translate(-120vw,-30px) rotate(-1240deg)}
    8%{opacity:1}
    44%{transform:translate(8vw,2px) rotate(-260deg)}
    60%{transform:translate(4vw,-44px) rotate(-140deg)}
    75%{transform:translate(1.4vw,2px) rotate(-56deg)}
    86%{transform:translate(.4vw,-16px) rotate(-18deg)}
    94%{transform:translate(0,2px) rotate(6deg)}
    100%{transform:translate(0,0) rotate(11deg)}}
</style>
</head>

<script>
/* ============================ CONSTANTS ============================ */
const GATE=21, NINE69=69, WIN=101, FIRE=75, STORE='lobsterDice.v2';
const STAKES=[0.25,0.5,1,2,5,10,100,1000];

/* ============================ STATE ============================ */
let S=null, history=[], modal=null, entryPts='';
const app=document.getElementById('app'), foot=document.getElementById('foot');
document.getElementById('rulesBtn').onclick=()=>{ modal={type:'rules'}; render(); };
document.getElementById('histBtn').onclick=()=>{ modal={type:'history'}; render(); refreshCloud(); };

let msg='', msgClass='';
function flash(m,c){ msg=m; msgClass=c||''; }

function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} pushLive(); }

/* broadcast live game state to watchers (debounced; scorekeeper's phone only) */
let liveTimer=null;
function pushLive(){
  if(typeof crew!=='function') return;
  const c=crew(); if(!c||!S||!S.players) return;
  clearTimeout(liveTimer);
  liveTimer=setTimeout(async()=>{
    try{
      const state={ phase:S.phase, stake:S.stake, ts:Date.now(), cur:S.cur, accrual:S.accrual||0,
        players:S.players.map(p=>({name:p.name,banked:p.banked,busts:p.busts,dubs:p.dubs})),
        endgame:S.endgame?{bestTotal:S.endgame.bestTotal,bestPlayer:S.endgame.bestPlayer,round:S.endgame.round,left:S.endgame.q.length}:null };
      await fetch(`${SUPA_URL}/rest/v1/live`,{method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({code:c.code,state,updated_at:new Date().toISOString()})});
    }catch(e){}
  },1000);
}
function load(){ try{ const r=localStorage.getItem(STORE); return r?JSON.parse(r):null; }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(STORE); }catch(e){} }

/* finished-game archive (separate key so "New game" never touches it) */
const HSTORE='lobsterDice.history';
function loadHist(){ try{ const r=localStorage.getItem(HSTORE); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HSTORE, JSON.stringify(h.slice(-50))); }catch(e){} }
function archiveGame(){
  if(S.archived) return; S.archived=true;
  const rec={ id:newId(), ts:Date.now(), stake:S.stake,
    players:S.players.map(p=>({name:p.name,banked:p.banked,busts:p.busts,dubs:p.dubs,biggest:p.biggest,log:p.log})) };
  const h=loadHist();
  h.push(rec);
  saveHist(h);
  updateSeries();
  queueGame(rec);
}

/* ============================ CREW SYNC (Supabase) ============================
   Local-first: the game never waits on the network. Finished games are queued
   in an outbox and uploaded when possible; any phone with the crew code sees
   the shared history and all-time ledger. */
const SUPA_URL='https://exxpaetnxamzqifqkyly.supabase.co';
const SUPA_KEY='sb_publishable_9GwDTfWTGJYRq0Qjb1EO8g_n5Bf6ayw';
const CREWSTORE='lobsterDice.crew', OUTBOX='lobsterDice.outbox';
const WATCH=(new URLSearchParams(location.search)).get('watch');
let cloudGames=null, histList=null;

function crew(){ try{ const r=localStorage.getItem(CREWSTORE); return r?JSON.parse(r):null; }catch(e){ return null; } }
function setCrew(c){ try{ c?localStorage.setItem(CREWSTORE,JSON.stringify(c)):localStorage.removeItem(CREWSTORE); }catch(e){} }
function sbHeaders(){ return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; }
function outbox(){ try{ const r=localStorage.getItem(OUTBOX); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function saveOutbox(a){ try{ localStorage.setItem(OUTBOX,JSON.stringify(a)); }catch(e){} }
function newId(){ return (crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }

function queueGame(rec){
  const c=crew(); if(!c) return;
  const a=outbox();
  if(!a.some(x=>x.id===rec.id)) a.push({id:rec.id, code:c.code, played_at:new Date(rec.ts).toISOString(), stake:rec.stake, players:rec.players});
  saveOutbox(a); trySync();
}
let syncBusy=false;
async function trySync(){
  const c=crew(); if(!c||syncBusy) return; if(!outbox().length) return;
  syncBusy=true;
  try{
    for(const g of outbox()){
      const r=await fetch(`${SUPA_URL}/rest/v1/games`,{method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=ignore-duplicates'},body:JSON.stringify(g)});
      if(!(r.ok||r.status===409)) break;
      saveOutbox(outbox().filter(x=>x.id!==g.id));
    }
  }catch(e){} finally{ syncBusy=false; }
}
async function fetchCloudGames(){
  const c=crew(); if(!c) return null;
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/games?code=eq.${encodeURIComponent(c.code)}&select=id,played_at,stake,players&order=played_at.desc&limit=200`,{headers:sbHeaders()});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
function refreshCloud(){
  if(!crew()){ cloudGames=null; return; }
  trySync();
  fetchCloudGames().then(g=>{ cloudGames=g||[]; if(modal&&modal.type==='history') render(); });
}
function randCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
async function createCrew(){
  for(let t=0;t<6;t++){
    const code=randCode();
    try{
      const r=await fetch(`${SUPA_URL}/rest/v1/tables`,{method:'POST',headers:sbHeaders(),body:JSON.stringify({code})});
      if(r.ok){ setCrew({code}); backfill(); return code; }
      if(r.status===409) continue;   // code taken — roll another
      return null;
    }catch(e){ return null; }
  }
  return null;
}
async function joinCrew(code){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/tables?code=eq.${encodeURIComponent(code)}&select=code`,{headers:sbHeaders()});
    if(!r.ok) return false;
    const a=await r.json(); if(!a.length) return false;
    setCrew({code}); backfill(); return true;
  }catch(e){ return false; }
}
/* on joining/creating a crew, this phone's past games upload too */
function backfill(){
  const h=loadHist(); let changed=false;
  h.forEach(g=>{ if(!g.id){ g.id=newId(); changed=true; } });
  if(changed) saveHist(h);
  h.forEach(g=>queueGame(g));
}

/* ============================ WATCH MODE (spectators) ============================
   Anyone opening ?watch=CODE — app or plain browser — gets a read-only,
   self-refreshing scoreboard. Only the scorekeeper's phone feeds it. */
let watchData=null, watchGames=null;
async function fetchWatch(){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/live?code=eq.${encodeURIComponent(WATCH)}&select=state,updated_at`,{headers:sbHeaders()});
    if(r.ok){ const a=await r.json(); watchData=a.length?a[0]:null; }
  }catch(e){}
  const st=watchData&&watchData.state;
  if(st&&st.phase==='playing') watchGames=null;                 // new game running — refetch ledger at its end
  if(st&&st.phase==='ended'&&!watchGames){
    try{
      const r2=await fetch(`${SUPA_URL}/rest/v1/games?code=eq.${encodeURIComponent(WATCH)}&select=stake,players,played_at&order=played_at.desc&limit=200`,{headers:sbHeaders()});
      if(r2.ok) watchGames=await r2.json();
    }catch(e){}
  }
  render();
}
function startWatch(){ foot.textContent='📺 live scoreboard · crew '+WATCH; fetchWatch(); setInterval(fetchWatch,4000); }
function renderWatch(){
  const st=watchData&&watchData.state;
  if(!st){
    app.innerHTML=`<div class="card" style="text-align:center"><div class="burst">📺</div>
      <h2 style="font-size:20px">Waiting for the table…</h2>
      <p style="color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0">Crew <b style="color:#fff">${esc(WATCH||'')}</b> isn’t broadcasting yet.<br>This page updates by itself — leave it open.</p></div>`;
    return;
  }
  const lead=Math.max(...st.players.map(p=>p.banked));
  const anyFire=st.players.some(p=>p.banked>=FIRE);
  const rows=st.players.map((p,i)=>{
    const isLead=p.banked===lead&&lead>0, gap=lead-p.banked;
    return `<div class="p ${i===st.cur&&st.phase==='playing'?'active':''} ${p.banked===0?'zero':''}">
      <div class="pn">${i===st.cur&&st.phase==='playing'?'<span class="dot"></span>':''}${esc(p.name)}${p.banked===0?` <span class="tag0">— on 0</span>${anyFire?'<span class="warn0">⚠️</span>':''}`:''}</div>
      <div class="gap">${isLead?'<span class="lead">LEAD</span>':(gap>0?`−${gap}`:'')}</div>
      <div class="score ${p.banked>=FIRE?'fire':''}">${p.banked>=FIRE?'<span class="fl">🔥</span>':''}${p.banked}</div></div>`;
  }).join('');
  const ago=Math.max(0,Math.round((Date.now()-Date.parse(watchData.updated_at))/1000));
  const banner=st.endgame&&st.phase==='playing'?`<div class="banner">🏁 Final round ${st.endgame.round} — beat ${st.endgame.bestTotal} (${esc(st.players[st.endgame.bestPlayer].name)})<small>${st.endgame.left} turn${st.endgame.left!==1?'s':''} left · no ties — beat it outright</small></div>`:'';
  const turnHtml=st.phase==='playing'?`<div class="card" style="text-align:center;padding:13px"><span style="color:var(--muted);font-size:13px;font-weight:700">🎲 ${esc(st.players[st.cur].name)} is rolling</span><span style="font-size:24px;font-weight:900;margin-left:10px;color:var(--good)">${st.accrual>0?'+'+st.accrual:''}</span></div>`:'';

/* running money ledger across consecutive games with the SAME crew */
const SSTORE='lobsterDice.series';
function loadSeries(){ try{ const r=localStorage.getItem(SSTORE); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveSeries(s){ try{ localStorage.setItem(SSTORE, JSON.stringify(s)); }catch(e){} }
function seriesKey(players){ return players.map(p=>p.name.toLowerCase()).sort().join('|'); }
function updateSeries(){
  const {tie,rows}=payouts();
  const key=seriesKey(S.players);
  let sr=loadSeries();
  if(!sr || sr.key!==key){ sr={key, games:0, nets:{}, ts:Date.now()}; S.players.forEach(p=>sr.nets[p.name]=0); }
  sr.games++;
  if(!tie) rows.forEach(r=>{ sr.nets[r.from]-=r.amount; sr.nets[r.to]+=r.amount; });
  saveSeries(sr);
}
/* minimal set of payments that settles everyone's running net */
function settleNets(nets){
  const cred=[],deb=[];
  Object.entries(nets).forEach(([n,v])=>{ if(v>0.005)cred.push({n,v}); else if(v<-0.005)deb.push({n,v:-v}); });
  cred.sort((a,b)=>b.v-a.v); deb.sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<cred.length&&j<deb.length){
    const x=Math.min(cred[i].v,deb[j].v);
    out.push({from:deb[j].n,to:cred[i].n,amount:x});
    cred[i].v-=x; deb[j].v-=x;
    if(cred[i].v<0.005)i++; if(deb[j].v<0.005)j++;
  }
  return out;
}

function snapshot(){ history.push(JSON.stringify({S,entryPts})); if(history.length>60) history.shift(); }
function undo(){ if(!history.length) return; const p=JSON.parse(history.pop()); S=p.S; entryPts=p.entryPts; flash('Undid last action.',''); render(); }
function clearHistory(){ history=[]; }

function startGame(){
  const d=draft;
  const names=d.names.map(n=>n.trim()).filter(Boolean);
  const stake=Number(d.customStake!==''?d.customStake:d.stake)||0;
  try{ localStorage.setItem(LSETUP, JSON.stringify({names,stake:d.stake,customStake:d.customStake,liability:d.liability})); }catch(e){}
  S={ phase:'playing', stake, liability:d.liability, editOrder:false,
    players:names.map((n,i)=>({ id:'p'+i+'_'+(Date.now()%100000), name:n, banked:0, busts:0, dubs:0, biggest:0, log:[] })),
    cur:0, endgame:null, accrual:0, turnAdds:[], mustRoll:false };
  clearHistory(); entryPts=''; flash('','');
  save(); render();
}

/* ============================ HELPERS ============================ */
const P=()=>S.players[S.cur];
const N=()=>S.players.length;
const bestNow=()=>Math.max(...S.players.map(p=>p.banked));
const gateActive=p=>p.banked===0;

function bankBlock(pts){
  const p=P();
  if(!(pts>0)) return 'need a number';
  if(S.mustRoll) return `that ${S.mustRoll} was double ${S.mustRoll/2}s — roll again before banking`;
  if(gateActive(p) && pts<GATE) return `on the board at ${GATE} — need ${GATE} in one turn`;
  if(p.banked+pts===NINE69) return 'can’t stop on 69 — keep rolling';
  if(S.endgame && p.banked+pts===S.endgame.bestTotal) return `no ties — beat ${S.endgame.bestTotal} outright or keep rolling`;
  return '';
}

/* ============================ TURN ACTIONS ============================ */
function turnTotal(){ return S.accrual||0; }

function doAdd(v){
  if(!(v>0)) return;
  snapshot();
  S.accrual=(S.accrual||0)+v;
  S.turnAdds.push(v);
  S.mustRoll=(v===4||v===12)?v:false;   // 4 = only 2+2 (3+1 is a lobster), 12 = only 6+6 — doubles force a re-roll
  if(S.mustRoll) flash(`+${v} — that’s double ${v/2}s! Roll again.`,'warn');
  else flash(`+${v} — turn total ${S.accrual}.`,'good');
  save(); render();
}
function doBank(){
  const pts=turnTotal();
  const block=bankBlock(pts); if(block) return;
  snapshot();
  const p=P(), amt=S.accrual;
  p.banked+=amt; if(amt>p.biggest) p.biggest=amt;
  p.log.push({t:'bank',pts:amt,total:p.banked,adds:[...S.turnAdds]});
  flash(`✅ ${p.name} banked ${amt} → ${p.banked}.`,'good');
  advance(true);
}
function doLobster(){
  snapshot();
  const p=P(); p.busts++; const lost=turnTotal();
  p.log.push({t:'lobster',lost});
  flash(lost>0?`🦞 Lobster — ${p.name} loses ${lost} this turn.`:`🦞 Lobster — ${p.name} loses the turn.`,'bad');
  advance(false);
}
function doDouble(){
  snapshot();
  const p=P(); p.dubs++; const had=p.banked; p.banked=0;
  p.log.push({t:'double',from:had});
  flash(`🦞🦞 Double lobster — ${p.name} wiped to 0!`,'bad');
  advance(false);
}

/* ============================ TURN ADVANCE + ENDGAME ============================ */
function advance(wasBank){
  S.accrual=0; S.turnAdds=[]; S.mustRoll=false;
  const p=P();
  // trigger endgame the first time anyone banks to 101+
  if(!S.endgame && wasBank && p.banked>=WIN){
    startEndgame();
    save(); render(); return;
  }
  if(S.endgame){ endgameAdvance(); save(); render(); return; }
  // normal rotation
  S.cur=(S.cur+1)%N();
  save(); render();
}

/* Endgame = the dice keep going around the circle; the game ends the moment the
   turn would return to the current leader. Taking the lead resets the countdown:
   everyone except the new leader gets one turn, starting with the next seat —
   and turns already taken since the last lead change count. */
function startEndgame(){
  const leader=S.cur;
  const q=[]; for(let k=1;k<N();k++) q.push((leader+k)%N());   // everyone else, one turn
  S.endgame={ bestTotal:P().banked, bestPlayer:leader, round:1, q };
  flash(`🏁 ${P().name} hit ${P().banked}! Final round — one turn each to catch them.`,'warn');
  S.cur=q[0];
}

function endgameAdvance(){
  const eg=S.endgame;
  const justActed=S.cur;
  if(S.players[justActed].banked>eg.bestTotal){
    // new leader — countdown resets NOW: everyone else gets one turn, next seat first
    eg.bestTotal=S.players[justActed].banked; eg.bestPlayer=justActed; eg.round++;
    eg.q=[]; for(let k=1;k<N();k++) eg.q.push((justActed+k)%N());
    S.cur=eg.q[0];
    flash(`🏁 ${S.players[justActed].name} took the lead at ${eg.bestTotal}! Everyone else gets one more turn.`,'warn');
    return;
  }
  eg.q.shift();
  if(eg.q.length===0){ finalize(); return; }   // dice reached the leader — game over
  S.cur=eg.q[0];
}

function finalize(){ S.phase='ended'; modal=null; archiveGame(); save(); render(); }

/* ============================ PAYOUTS ============================ */
function payoutsFor(players,stake){
  const winTotal=Math.max(...players.map(p=>p.banked));
  const winners=players.filter(p=>p.banked===winTotal);
  const tie=winners.length>1; const winner=winners[0];
  const rows=players.filter(p=>p!==winner && p.banked<winTotal).map(p=>{
    const gap=winTotal-p.banked, zero=p.banked===0, rate=stake*(zero?2:1);
    return {from:p.name,to:winner.name,amount:gap*rate,gap,zero};
  });
  return {winTotal,winner,tie,winners,rows};
}
function payouts(){ return payoutsFor(S.players,S.stake); }

function reorder(i,dir){
  const j=i+dir; if(j<0||j>=N()) return;
  snapshot();
  const curId=P().id;
  [S.players[i],S.players[j]]=[S.players[j],S.players[i]];
  S.cur=S.players.findIndex(x=>x.id===curId);
  save(); render();
}

    html=`<div class="modal"><h2>🦞 Lobster Dice — rules</h2><div class="rul">
      <p style="margin:0 0 8px">Two dice; each die's <b>1</b> is a lobster (🦞, 2, 3, 4, 5, 6). Keep rolling to build your turn total, then bank it — if you don't lobster first.</p>
      <h3>Lobsters</h3>One lobster: <b>turn total lost</b>, banked score safe. Two lobsters: <b>banked score wiped to 0</b>.
      <h3>Doubles</h3>Any double (2-2…6-6) scores its pips but <b>forces another roll</b> — you can't bank on a double. A roll of <b>4</b> is always double 2s (3+1 would be a lobster) and a <b>12</b> is always double 6s, so the app auto-forces those re-rolls.
      <h3>The 21 gate</h3>You can't bank until you clear <b>21+ in a single turn</b>. After a double-lobster reset to 0, you must clear 21 again.
      <h3>The 69 rule</h3>No one may stop on a total of exactly <b>69</b> — roll again.
      <h3>Playing to 101</h3>First to bank <b>101+</b> becomes the leader. The dice keep going around the table — <b>the game ends the moment the dice would return to the current leader</b>. <b>No ties</b>: land exactly on the leader's total and you must roll again — beat it outright or bust. If someone <b>surpasses</b> the leader, they become the new leader and the countdown resets: everyone <b>else</b> gets one turn (next seat first) to answer. Highest total wins.
      <h3>Off the table</h3>One die rolled off the table = a <b>single lobster</b>. Both dice off = a <b>double lobster</b>.
      <h3>Payouts</h3>Each opponent pays the winner <b>stake × their point gap</b>. Anyone finishing on <b>0</b> pays <b>double</b>.
      </div><div class="spacer"></div><button class="btn ghost" id="m_close">Close</button></div>`;
  } else if(modal.type==='history'){
    const c=crew();
    const local=loadHist();
    const cloudMapped=(cloudGames||[]).map(g=>({id:g.id, ts:Date.parse(g.played_at), stake:Number(g.stake), players:g.players}));
    const seen=new Set(local.map(g=>g.id).filter(Boolean));
    const merged=[...local, ...cloudMapped.filter(g=>!seen.has(g.id))].sort((a,b)=>b.ts-a.ts);
    histList=merged;
    const pend=outbox().length;
    const crewHtml=c
      ? `<div class="crewbox">
           <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
             <div><div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.12em">🔗 Crew code</div>
             <div class="crewcode-big">${esc(c.code)}</div></div>
             <button class="lk" id="m_crewleave">Leave</button>
           </div>
           <div class="cb-hint" style="margin-top:6px">${cloudGames===null?'Syncing…':`${merged.length} game${merged.length!==1?'s':''} shared`}${pend?` · <span style="color:var(--warn)">${pend} waiting to upload</span>`:' · every phone with this code sees the same history & ledger'}</div>
           <div class="row" style="margin-top:10px">
             <button class="btn ghost sm" id="m_watch">📺 Watch live</button>
             <button class="btn sea sm" id="m_sharewatch">Share live link</button>
           </div>
         </div>`
      : `<div class="crewbox">
           <div class="cb-title">🔗 Crew sync</div>
           <div class="cb-hint">Share one 4-letter code with your table — every phone that joins sees the same game history and money ledger.</div>
           <div class="spacer"></div>
           <button class="btn sea sm" id="m_crewnew">Create a crew code</button>
           <div class="cb-hint" style="text-align:center;margin-top:8px">— or join with the code your scorekeeper shares —</div>
           <div class="crewrow">
             <input id="crewcode" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off">
             <button class="btn gold sm" id="m_crewjoin">Join</button>
           </div>
           <div class="cb-hint" id="crewmsg" style="margin-top:6px;color:var(--warn)"></div>
         </div>`;
    let crewLedger='';
    if(c&&merged.length){
      const nets={};
      merged.forEach(g=>{ const {tie,rows}=payoutsFor(g.players,g.stake); if(!tie) rows.forEach(r=>{ nets[r.from]=(nets[r.from]||0)-r.amount; nets[r.to]=(nets[r.to]||0)+r.amount; }); });
      const bal=Object.entries(nets).sort((a,b)=>b[1]-a[1]).map(([n,v])=>
        `<div class="liab"><span>${esc(n)}</span><b style="color:${v>0.005?'var(--good)':v<-0.005?'#ffb3ab':'var(--muted)'}">${v>0.005?'+':v<-0.005?'−':''}$${money(Math.abs(v)<0.005?0:Math.abs(v))}</b></div>`).join('');
      const tr=settleNets(nets);
      crewLedger=`<h3 style="font-size:13px;margin:4px 0 2px;color:#fff">💰 All-time crew ledger · ${merged.length} game${merged.length!==1?'s':''}</h3>${bal}
        ${tr.map(t=>`<div class="logline"><span class="t">${esc(t.from)} → ${esc(t.to)}</span><span class="v b">$${money(t.amount)}</span></div>`).join('')}<div class="spacer"></div>`;
    }
    const items=merged.length?merged.map((g,k)=>{
      const {winTotal,winner,tie}=payoutsFor(g.players,g.stake);
      const d=new Date(g.ts);
      return `<button class="histrow" data-h="${k}">
        <span>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${g.players.length} players · $${fmtStake(Number(g.stake))}/pt</span>
        <b>🏆 ${tie?'Tie':esc(winner.name)} · ${winTotal}</b></button>`;
    }).join(''):'<p>No finished games yet — every completed game lands here automatically.</p>';
    const shareIcon='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:7px"><path d="M12 3v12"/><path d="M8 6l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
    html=`<div class="modal"><h2>📜 Previous games</h2>
      <button class="btn gold sm" id="m_shareapp" style="margin-bottom:12px">${shareIcon}Share the app with the table</button>
      ${crewHtml}${crewLedger}${items}<div class="spacer"></div><button class="btn ghost" id="m_close">Close</button></div>`;
  } else if(modal.type==='histgame'){
    const g=histList?histList[modal.idx]:loadHist()[modal.idx];
    if(!g){ modal={type:'history'}; renderModal(); return; }
    const {winTotal,winner,tie,winners,rows}=payoutsFor(g.players,g.stake);
    const d=new Date(g.ts);
    const ranked=[...g.players].sort((a,b)=>b.banked-a.banked);
    const stand=ranked.map((p,i)=>`<div class="logline"><span class="t">${p.banked===winTotal?'🏆':'#'+(i+1)} ${esc(p.name)}${p.banked===0?' <span class="tag0">on 0</span>':''}</span><span class="v ${p.banked===winTotal?'b':''}">${p.banked}</span></div>`).join('');
    const ledger=tie?`<p>🤝 Tie at ${winTotal} — ${winners.map(w=>esc(w.name)).join(' & ')}.</p>`
      :rows.map(r=>`<div class="logline"><span class="t">${esc(r.from)} → ${esc(r.to)}${r.zero?' <span class="tag0">💥 2×</span>':''}</span><span class="v l">$${money(r.amount)}</span></div>`).join('')||'<p>No one owed.</p>';
    const logs=g.players.map(pl=>{
      const lines=pl.log&&pl.log.length?pl.log.map((e,k)=>{
        if(e.t==='bank'){ const dd=e.adds&&e.adds.length>1?` (${e.adds.join('+')})`:''; return `<div class="logline"><span class="t">T${k+1} · banked ${e.pts}${dd}</span><span class="v b">${e.total}</span></div>`; }
        if(e.t==='lobster') return `<div class="logline"><span class="t">T${k+1} · 🦞</span><span class="v l">${e.lost?`lost ${e.lost}`:'lost'}</span></div>`;
        return `<div class="logline"><span class="t">T${k+1} · 🦞🦞</span><span class="v l">${e.from?e.from+' ':''}→ 0</span></div>`;
      }).join(''):'<p style="margin:4px 0">No turns logged.</p>';
      return `<h3 style="font-size:13px;margin:14px 0 2px;color:#fff">${esc(pl.name)} — ${pl.banked} <span style="color:var(--muted);font-weight:700">· ${pl.busts}🦞 · ${pl.dubs}🦞🦞 · best ${pl.biggest}</span></h3>${lines}`;
    }).join('');
    html=`<div class="modal"><h2>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · $${fmtStake(g.stake)}/pt</h2>
      <div class="rul"><h3 style="font-size:14px;margin:8px 0 2px;color:#fff">Standings</h3>${stand}
      <h3 style="font-size:14px;margin:14px 0 2px;color:#fff">💰 Settle-up</h3>${ledger}
      <h3 style="font-size:14px;margin:14px 0 0;color:#fff">Turn-by-turn</h3>${logs}</div>
      <div class="spacer"></div>
      <button class="btn ghost" id="m_back">← All games</button><div class="spacer"></div>
      <button class="btn ghost" id="m_close">Close</button></div>`;
  }
  ov.innerHTML=html;
  document.querySelector('.wrap').appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov){ modal=null; render(); } });
  const close=document.getElementById('m_close'); if(close) close.onclick=()=>{ modal=null; render(); };
  const back=document.getElementById('m_back'); if(back) back.onclick=()=>{ modal={type:'history'}; render(); };
  ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ modal={type:'histgame',idx:+b.dataset.h}; render(); });
  const cn=document.getElementById('m_crewnew');
  if(cn) cn.onclick=async()=>{ cn.textContent='Creating…'; cn.disabled=true;
    const code=await createCrew();
    if(!code){ const m=document.getElementById('crewmsg'); if(m) m.textContent='Couldn’t reach the sync server — check your connection and try again.'; cn.textContent='Create a crew code'; cn.disabled=false; return; }
    render(); refreshCloud(); };
  const doJoin=async()=>{
    const inp=document.getElementById('crewcode');
    const code=(inp&&inp.value||'').trim().toUpperCase();
    const m=document.getElementById('crewmsg');
    if(code.length!==4){ if(m) m.textContent='Codes are 4 characters — like CLAW.'; return; }
    if(m) m.textContent='Checking…';
    const okj=await joinCrew(code);
    if(!okj){ if(m) m.textContent='Code not found — double-check it with whoever created it.'; return; }
    render(); refreshCloud();
  };
  const cj=document.getElementById('m_crewjoin');
  if(cj) cj.onclick=doJoin;
  const ci=document.getElementById('crewcode');
  if(ci) ci.onkeydown=e=>{ if(e.key==='Enter') doJoin(); };
  const cl=document.getElementById('m_crewleave');
  if(cl) cl.onclick=()=>{ if(confirm('Leave this crew? Synced games stay in the cloud; this phone just stops syncing.')){ setCrew(null); cloudGames=null; render(); } };
  const sa=document.getElementById('m_shareapp');
  if(sa) sa.onclick=async()=>{
    const url=location.origin+location.pathname;
    const text='Lobster Dice 🦞🎲 — the scorepad + stakes tracker for our game. Open it, then tap Share → Add to Home Screen:';
    if(navigator.share){ try{ await navigator.share({title:'Lobster Dice',text,url}); }catch(e){} }
    else if(navigator.clipboard){ try{ await navigator.clipboard.writeText(url); alert('App link copied — text it to the table:\n'+url); }catch(e){ alert('App link:\n'+url); } }
    else alert('App link:\n'+url);
  };
  const mw=document.getElementById('m_watch');
  if(mw) mw.onclick=()=>{ const c2=crew(); if(c2) location.href=location.pathname+'?watch='+encodeURIComponent(c2.code); };
  const ms=document.getElementById('m_sharewatch');
  if(ms) ms.onclick=async()=>{ const c2=crew(); if(!c2) return;
    const url=location.origin+location.pathname+'?watch='+encodeURIComponent(c2.code);
    if(navigator.share){ try{ await navigator.share({title:'Lobster Dice — live scoreboard',text:'Watch our Lobster Dice game live:',url}); }catch(e){} }
    else if(navigator.clipboard){ try{ await navigator.clipboard.writeText(url); alert('Live link copied — text it to anyone:\n'+url); }catch(e){ alert('Live link:\n'+url); } }
    else alert('Live link:\n'+url); };
  const f=document.getElementById('m_finish'); if(f) f.onclick=()=>{ modal=null; finalize(); };
  const nw=document.getElementById('m_new'); if(nw) nw.onclick=()=>{ if(confirm('Scrap this game and start over?')){ wipe(); S=null; modal=null; newSetup(); render(); } };
}

/* ============================ RENDER: END ============================ */
function renderEnd(){
  const {winTotal,winner,tie,winners,rows}=payouts();
  const ranked=[...S.players].sort((a,b)=>b.banked-a.banked);
  foot.textContent='game over';
  const standHtml=ranked.map((p,i)=>{ const win=p.banked===winTotal;
    return `<div class="stand ${win?'win':''}"><div class="rk">${win?'🏆':'#'+(i+1)}</div>
      <div class="nm">${esc(p.name)}${p.banked===0?' <span class="tag0">— finished on 0</span>':''}</div>
      <div class="tot">${p.banked}</div></div>`; }).join('');

  let ledgerHtml;
  if(tie){ ledgerHtml=`<div class="ledger"><div class="txt">🤝 Tie at ${winTotal} — ${winners.map(w=>esc(w.name)).join(' & ')}. House call: split the pot or play a sudden-death turn.</div></div>`; }
  else if(rows.length===0){ ledgerHtml=`<div class="ledger"><div class="txt">Everyone tied the winner — no one owes.</div></div>`; }
  else{
    ledgerHtml=rows.map(r=>`<div class="ledger ${r.zero?'z':''}">
      <div class="txt">${esc(r.from)} → ${esc(r.to)}<br><span style="font-size:11px;color:#a9bad6">${r.gap} pts × $${fmtStake(S.stake)}${r.zero?' × 2':''}</span>${r.zero?'<div class="zbadge">💥 ZERO DOUBLER</div>':''}</div>
      <div class="amt">$${money(r.amount)}</div></div>`).join('');
    const total=rows.reduce((s,r)=>s+r.amount,0);
    ledgerHtml+=`<div class="ledger" style="background:transparent;border:1px dashed var(--line)"><div class="txt">${esc(winner.name)} collects</div><div class="amt" style="color:var(--gold)">$${money(total)}</div></div>`;
  }

  const margin=ranked.length>1?winTotal-ranked[1].banked:0;
  const busts=S.players.reduce((s,p)=>s+p.busts,0);
  const dubs=S.players.reduce((s,p)=>s+p.dubs,0);
  const big=S.players.reduce((m,p)=>p.biggest>m.v?{v:p.biggest,who:p.name}:m,{v:0,who:'—'});

  // series card: running tab across consecutive games with this same crew
  let seriesHtml='';
  const sr=loadSeries();
  if(sr && sr.key===seriesKey(S.players)){
    const balances=Object.entries(sr.nets).sort((a,b)=>b[1]-a[1]).map(([n,v])=>
      `<div class="liab"><span>${esc(n)}</span><b style="color:${v>0.005?'var(--good)':v<-0.005?'#ffb3ab':'var(--muted)'}">${v>0.005?'+':v<-0.005?'−':''}$${money(Math.abs(v)<0.005?0:Math.abs(v))}</b></div>`).join('');
    const transfers=settleNets(sr.nets);
    const transferHtml=sr.games>1?(transfers.length
      ? `<div class="label" style="margin-top:12px">One payment each settles everything</div>`+
        transfers.map(t=>`<div class="logline"><span class="t">${esc(t.from)} → ${esc(t.to)}</span><span class="v b">$${money(t.amount)}</span></div>`).join('')
      : `<div class="hint">All square — nobody owes anything across the series.</div>`):'';
    seriesHtml=`<div class="card">
      <div class="label">📊 Series — game ${sr.games}<button class="lk" id="resetSeries">Reset</button></div>
      ${balances}
      ${transferHtml}
      <div class="hint">Running tab across games with this crew. Keeps counting as long as the same names play.</div>
    </div>`;
  }

  app.innerHTML=`
    <div class="card" style="text-align:center"><div class="burst" style="font-size:52px">🏆</div>
      <h2 style="font-size:24px">${tie?'It’s a tie!':esc(winner.name)+' wins!'}</h2>
      <p style="color:var(--muted);margin:6px 0 0">${tie?`${winTotal} apiece`:`${winTotal} points · won by ${margin}`}</p></div>
    <div class="card"><div class="label">Final standings</div>${standHtml}</div>
    <div class="card"><div class="label">💰 Settle up — $${fmtStake(S.stake)}/point</div>${ledgerHtml}
      <div class="hint">Zero-doubler: anyone finishing on 0 pays <b>double</b> their gap.</div></div>

    ${seriesHtml}
    <div class="card"><div class="label">Table stats</div><div class="stats">
      <div class="stat"><div class="v">${busts}</div><div class="k">🦞 lobster busts</div></div>
      <div class="stat"><div class="v">${dubs}</div><div class="k">🦞🦞 double lobsters</div></div>
      <div class="stat"><div class="v">${big.v}</div><div class="k">biggest turn · ${esc(big.who)}</div></div>
      <div class="stat"><div class="v">${N()}</div><div class="k">players</div></div></div></div>
    <button class="btn" id="again">🎲 New game</button>`;
  document.getElementById('again').onclick=()=>{ wipe(); S=null; newSetup(); render(); };
  const rs=document.getElementById('resetSeries');
  if(rs) rs.onclick=()=>{ if(confirm('Reset the series tab to $0 for everyone?')){ try{ localStorage.removeItem(SSTORE); }catch(e){} render(); } };
}

/* ============================ ROUTER + UTIL ============================ */
function render(){
  if(WATCH){ renderWatch(); }
  else if(!S){ if(!draft) newSetup(); renderSetup(); }
  else if(S.phase==='playing') renderGame();
  else if(S.phase==='ended') renderEnd();
  else renderSetup();
  const old=document.querySelector('.ov'); if(old) old.remove();
  if(modal) renderModal();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtStake(s){ return Number.isInteger(s)?s.toLocaleString():s.toString(); }
function money(n){ return (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); }

/* ============================ BOOT ============================ */
(function(){
  const sp=document.getElementById('splash');
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),380); },1900);
  if(WATCH){ startWatch(); return; }
  const s=load(); if(s&&s.players){ S=s; S.accrual=S.accrual||0; S.turnAdds=S.turnAdds||[]; if(S.mustRoll===true) S.mustRoll=4; } render();
  trySync();   // push any games that finished offline
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
</body>
</html>
